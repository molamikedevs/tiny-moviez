<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16181e" />
    <meta
      name="description"
      content="TinyMoviez: browse trending movies, TV shows and anime, see what's coming soon and in theaters, and bookmark titles to watch later."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@300..800&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="src/img/favicon.png" />
    <link rel="apple-touch-icon" href="src/img/favicon.png" />

    <link rel="stylesheet" href="src/sass/main.scss" />
    <script type="module" defer src="src/js/controller.js"></script>

    <title>Tiny Moviez // Search over 1,000,000 movies</title>
  </head>

  <body class="app">
    <div class="dashboard">
      <!-- SIDEBAR -->
      <aside class="sidebar" aria-label="Main menu">
        <div class="sidebar__logo">
          <h2 class="logo">TINY<br />MOVIEZ</h2>
        </div>

        <div class="sidebar__section">
          <p class="sidebar__title">Menu</p>
          <ul class="sidebar__menu">
            <li>
              <button type="button" class="menu__item" data-type="movie">
                <svg class="menu__icon" aria-hidden="true">
                  <use href="src/img/icons.svg#icon-film"></use>
                </svg>
                <span>Movies</span>
              </button>
            </li>
            <li>
              <button type="button" class="menu__item" data-type="tv">
                <svg class="menu__icon" aria-hidden="true">
                  <use href="src/img/icons.svg#icon-display"></use>
                </svg>
                <span>TV Shows</span>
              </button>
            </li>
            <li>
              <button
                type="button"
                class="menu__item mobile-hide"
                data-type="anime"
              >
                <svg class="menu__icon" aria-hidden="true">
                  <use href="src/img/icons.svg#icon-dice"></use>
                </svg>
                <span>Anime</span>
              </button>
            </li>
          </ul>
        </div>

        <div class="sidebar__section">
          <p class="sidebar__title">Library</p>
          <ul class="sidebar__menu">
            <li>
              <button
                type="button"
                class="menu__item mobile-hide"
                data-type="recent"
              >
                <svg class="menu__icon" aria-hidden="true">
                  <use href="src/img/icons.svg#icon-clock"></use>
                </svg>
                <span>Recent</span>
              </button>
            </li>
            <li>
              <button type="button" class="menu__item" data-type="bookmarks">
                <svg class="menu__icon" aria-hidden="true">
                  <use href="src/img/icons.svg#icon-bookmarks"></use>
                </svg>
                <span>Bookmarks</span>
              </button>
            </li>
            <li>
              <button
                type="button"
                class="menu__item mobile-hide"
                data-type="trending"
              >
                <svg class="menu__icon" aria-hidden="true">
                  <use href="src/img/icons.svg#icon-trending-up"></use>
                </svg>
                <span>Trending</span>
              </button>
            </li>
            <li>
              <button
                type="button"
                class="menu__item mobile-hide"
                data-type="topRated"
              >
                <svg class="menu__icon" aria-hidden="true">
                  <use href="src/img/icons.svg#icon-star-empty"></use>
                </svg>
                <span>Top Rated</span>
              </button>
            </li>

            <li>
              <button
                type="button"
                class="menu__item mobile-only"
                data-type="more"
                id="btn-mobile-more"
                aria-expanded="false"
              >
                <svg class="menu__icon" aria-hidden="true">
                  <use href="src/img/icons.svg#icon-read-more"></use>
                </svg>
                <span>More</span>
              </button>
            </li>
          </ul>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main">
        <!-- TOP NAV -->
        <header class="topbar">
          <nav class="topbar__nav" aria-label="Categories">
            <button class="nav__link" data-type="movie">Movies</button>
            <button class="nav__link" data-type="tv">TV Shows</button>
            <button class="nav__link" data-type="anime">Anime</button>
          </nav>

          <form class="topbar__search">
            <button type="submit" class="search__btn" aria-label="Search">
              <svg class="search__icon">
                <use href="src/img/icons.svg#icon-search"></use>
              </svg>
            </button>

            <input
              type="search"
              placeholder="Search"
              class="search__input"
              aria-label="Search movies and shows"
              enterkeyhint="search"
            />
          </form>
        </header>

        <!-- HERO / SLIDER -->
        <!-- Hidden until heroView has a slide to show -->
        <section class="hero" hidden>
          <div class="hero__media">
            <img class="hero__img" alt="" />
          </div>

          <div class="hero__overlay"></div>

          <div class="hero__content">
            <h1 class="hero__title"></h1>

            <div class="hero__actions">
              <button
                class="btn btn--bookmark js-bookmark"
                aria-pressed="false"
              >
                Bookmark
              </button>

              <button class="btn btn--primary js-details">Details</button>
            </div>
          </div>

          <div class="hero__controls">
            <button
              class="slider__btn slider__btn--prev"
              aria-label="Previous slide"
            >
              <svg class="slider__icon">
                <use href="src/img/icons.svg#icon-arrow-left2"></use>
              </svg>
            </button>

            <button
              class="slider__btn slider__btn--next"
              aria-label="Next slide"
            >
              <svg class="slider__icon">
                <use href="src/img/icons.svg#icon-arrow-right2"></use>
              </svg>
            </button>
          </div>
        </section>

        <!-- POPULAR MOVIES -->
        <section class="movies">
          <h2 class="section__title"></h2>
          <div class="movies__grid"></div>
        </section>

        <!-- PAGINATION: rendered by paginationView -->
        <div class="pagination"></div>
      </main>

      <!-- RIGHT SIDEBAR -->
      <aside class="rightbar">
        <!-- UPCOMING MOVIES -->
        <section class="widget" data-widget="upcoming">
          <div class="widget__header">
            <h3>Coming Soon</h3>
          </div>

          <div class="upcoming__list"></div>

          <div class="widget__footer">
            <div class="widget__pagination">
              <button
                class="widget__btn widget__btn--prev"
                data-direction="prev"
                aria-label="Previous upcoming page"
              >
                <svg>
                  <use href="src/img/icons.svg#icon-arrow-left2"></use>
                </svg>
              </button>
              <span class="widget__page-info">Page 1</span>
              <button
                class="widget__btn widget__btn--next"
                data-direction="next"
                aria-label="Next upcoming page"
              >
                <svg>
                  <use href="src/img/icons.svg#icon-arrow-right2"></use>
                </svg>
              </button>
            </div>
            <span class="widget__total"></span>
          </div>
        </section>

        <!-- IN THEATERS -->
        <section class="widget" data-widget="theaters">
          <div class="widget__header">
            <h3>In Theaters</h3>
          </div>

          <div class="theaters__list"></div>

          <div class="widget__footer">
            <div class="widget__pagination">
              <button
                class="widget__btn widget__btn--prev"
                data-direction="prev"
                aria-label="Previous theater page"
              >
                <svg>
                  <use href="src/img/icons.svg#icon-arrow-left2"></use>
                </svg>
              </button>
              <span class="widget__page-info">Page 1</span>
              <button
                class="widget__btn widget__btn--next"
                data-direction="next"
                aria-label="Next theater page"
              >
                <svg>
                  <use href="src/img/icons.svg#icon-arrow-right2"></use>
                </svg>
              </button>
            </div>
            <span class="widget__total"></span>
          </div>
        </section>

        <!-- POPULAR ACTORS -->
        <section class="widget" data-widget="actors">
          <div class="widget__header">
            <h3>Popular Actors</h3>
          </div>

          <div class="actors__list"></div>

          <div class="widget__footer">
            <div class="widget__pagination">
              <button
                class="widget__btn widget__btn--prev"
                data-direction="prev"
                aria-label="Previous actors page"
              >
                <svg>
                  <use href="src/img/icons.svg#icon-arrow-left2"></use>
                </svg>
              </button>
              <span class="widget__page-info">Page 1</span>
              <button
                class="widget__btn widget__btn--next"
                data-direction="next"
                aria-label="Next actors page"
              >
                <svg>
                  <use href="src/img/icons.svg#icon-arrow-right2"></use>
                </svg>
              </button>
            </div>
            <span class="widget__total"></span>
          </div>
        </section>
      </aside>
    </div>

    <!-- DETAILS DIALOG: outside .dashboard so the page can be made inert -->
    <div class="modal" aria-hidden="true"></div>
  </body>
</html>
